name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # tests/private only exists in the owner's repo and needs Windows-only extras.
        run: python -m pytest -q --ignore=tests/private

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard-v2/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard-v2
        run: npm ci

      - name: Lint
        working-directory: dashboard-v2
        run: npm run lint

      - name: Build
        working-directory: dashboard-v2
        run: npm run build
